# Glove80 dongle (central). The PandaKB dongle's OLED wiring lives in the
# pandakb_dongle shield, and the status screen comes from englmaxi's
# dongle_display.
#
# config/glove80.conf is intentionally not applied here (see Kconfig.shield),
# so the parts of it the dongle needs are repeated below. ZMK_SLEEP is the
# notable omission: deep sleep is only woken by a key press, and the dongle has
# no keys.

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_BATTERY_REPORTING=y

# The keymap uses five Bluetooth profiles (BT_SEL 0-4). On a dongle the two
# halves take two of the connection slots, so raise both limits to 5 + 2.
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Status screen: show the dongle's own battery and macOS modifier glyphs.
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y
CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
